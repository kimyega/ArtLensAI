spring.application.name=ArtLensAI

# =========================
# Application
# =========================
server.port=8080

# https://artlensai.kr
app.frontend-url=https://artlensai.kr

# =========================
# DB Connection
# =========================
spring.datasource.url=${POSTGRES_URL}
spring.datasource.username=${POSTGRES_USERNAME}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver


# =========================
# MongoDB Connection
# =========================
spring.data.mongodb.uri=${MONGO_URI}


# =========================
# JPA
# =========================
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.generate-ddl=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.hibernate.ddl-auto=update

spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.properties.hibernate.format_sql=true

# =========================
# JWT Settings
# =========================
jwt.secret=mySuperSecretKeyThatIsLongEnough123!
jwt.secret.key='123456781234567812345678123456781234'
jwt.token.creator=ArtLensAI

jwt.token.access.name=ACCESS_TOKEN
jwt.token.access.valid.time=1800

jwt.token.refresh.name=REFRESH_TOKEN
jwt.token.refresh.valid.time=604800

# 2days : 172800 , 7days+ : 800000
jwt.token.refresh.rotation-threshold=172800

jwt.token.password-reset.valid.time=600




# =========================
# LocalDateTime Settings
# =========================
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_default
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss



# =========================
# SMTP (Naver)
# =========================
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.from=${MAIL_FROM}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000


# =========================
# Redis Settings
# =========================
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.username=${REDIS_USERNAME}
spring.data.redis.password=${REDIS_PASSWORD}

# =========================
# Fast api
# =========================
fastapi.url=http://127.0.0.1:8000


# =========================
# NCP Storage
# =========================

ncp.endpoint=https://kr.ncloudstorage.com
ncp.bucket=artlens-bucket
ncp.access-key=${NCP_ACCESS_KEY}
ncp.secret-key=${NCP_SECRET_KEY}