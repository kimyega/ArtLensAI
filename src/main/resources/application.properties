spring.application.name=ArtLensAI

spring.config.import=optional:classpath:application-local.yml

# =========================
# Public Settings
# =========================
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
server.port=8080

# =========================
# DB Connection
# =========================
spring.datasource.url=${POSTGRES_URL}
spring.datasource.username=${POSTGRES_USERNAME}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver


# =========================
# MongoDB Connection
# =========================
spring.data.mongodb.uri=${MONGO_URI}


# =========================
# JWT Settings
# =========================
jwt.secret=mySuperSecretKeyThatIsLongEnough123!
jwt.expirationMs=3600000
jwt.refreshExpirationMs=86400000



# =========================
# LocalDateTime Settings
# =========================
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_default
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss



# =========================
# SMTP (Naver)
# =========================
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.from=${MAIL_FROM}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000


# =========================
# Redis Settings
# =========================
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.username=${REDIS_USERNAME}
spring.data.redis.password=${REDIS_PASSWORD}